function renderCompany(){let c=company();$('homeBtn').classList.remove('hide');$('catalogBtn').classList.remove('hide');$('mobileTotal').classList.toggle('hide',!base());$('app').innerHTML=`<div class="container"><div class="workspace-head"><img class="operator-logo" src="${LOGOS[c.logo]}"><div class="company-title">${esc(c.name)}</div><button id="backBtn" class="btn">Cambiar compañía</button></div><div class="tabs" style="--c:${c.accent}"><button class="tab ${mode==='convergente'?'active':''}" data-mode="convergente">CONVERGENTE</button>${c.supports2p?`<button class="tab ${mode==='2p'?'active':''}" data-mode="2p">2P · SOLO FIBRA</button>`:''}</div><div class="quickbar"><input id="searchBox" class="search" placeholder="Buscar: 1 Gb, 100 GB, TV, Digi, Antidigi..." value="${esc(search)}">${sourceOptions()}</div><div class="layout"><div><section class="card"><h3><span class="step">1</span>Elige la tarifa base</h3>${baseOptions()}</section>${adminPanel()}${buildDetails()}</div>${summary()}</div></div>`;bindCompany();renderMobile()}
function renderMobile(){let b=base();let m=$('mobileTotal');if(!b){m.classList.add('hide');return}m.classList.remove('hide');m.innerHTML=`<div class="mobile-total-in container"><div class="mobile-price"><strong>${euro(total())}/mes</strong><span>${esc(company().name)} · ${mode==='2p'?'2P':'Convergente'}</span></div><button id="mobileClient" class="btn primary">Ver oferta</button></div>`;$('mobileClient').onclick=showClient}
function bindCompany(){$('backBtn').onclick=renderHome;document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;resetBuild();renderCompany()});$('searchBox').oninput=e=>{search=e.target.value;renderCompany()};$('sourceFilter')?.addEventListener('change',e=>{source=e.target.value;selectedId=null;addedLines=[];chosenExtras=[];renderCompany()});document.querySelectorAll('[data-base]').forEach(b=>b.onclick=()=>{selectedId=b.dataset.base;addedLines=[];chosenExtras=[];renderCompany()});$('addLine')?.addEventListener('click',()=>{let id=$('lineSelect').value;if(!id)return;let src=currentLines().find(x=>x.id===id);let price=src.price;if(current==='yg'&&base()?.source==='antidigi')price=addedLines.length===0?6:9;addedLines.push({id:src.id,name:src.name,price});renderCompany()});document.querySelectorAll('[data-remline]').forEach(b=>b.onclick=()=>{addedLines.splice(Number(b.dataset.remline),1);if(current==='yg'&&base()?.source==='antidigi')addedLines=addedLines.map((x,i)=>({...x,price:i===0?6:9}));renderCompany()});document.querySelectorAll('[data-extra]').forEach(b=>b.onclick=()=>{let id=b.dataset.extra,i=chosenExtras.findIndex(x=>x.id===id);if(i>=0)chosenExtras.splice(i,1);else{let x=currentExtras().find(e=>e.id===id);chosenExtras.push({id:x.id,name:x.name,price:x.price})}renderCompany()});$('clientBtn')?.addEventListener('click',showClient);$('conditionsBtn')?.addEventListener('click',showConditions);$('resetBtn')?.addEventListener('click',()=>{resetBuild();renderCompany()});$('newOffer')?.addEventListener('click',()=>editOffer(null));document.querySelectorAll('[data-editoffer]').forEach(b=>b.onclick=()=>editOffer(Number(b.dataset.editoffer)));document.querySelectorAll('[data-deloffer]').forEach(b=>b.onclick=()=>{if(!confirm('¿Eliminar esta oferta?'))return;let key=mode==='2p'?'twoP':'convergente';company()[key].splice(Number(b.dataset.deloffer),1);resetBuild();save();renderCompany()})}
function showConditions(){let d=document.createElement('div');d.className='modal-bg';d.innerHTML=`<div class="modal"><div class="modal-head"><h2>Condiciones · ${esc(company().name)}</h2><button class="btn icon-btn" id="closeModal">×</button></div><div class="conditions">${company().conditions.map(x=>`<div class="condition">✓ ${esc(x)}</div>`).join('')}</div></div>`;document.body.appendChild(d);$('closeModal').onclick=()=>d.remove();d.onclick=e=>{if(e.target===d)d.remove()}}
function showCatalog(){let c=company();let all=[...c.convergente,...(c.supports2p?c.twoP:[])];let d=document.createElement('div');d.className='modal-bg';d.innerHTML=`<div class="modal"><div class="modal-head"><h2>Tarifario completo · ${esc(c.name)}</h2><button class="btn icon-btn" id="closeModal">×</button></div><div class="catalog-grid" style="--c:${c.accent}">${all.map(x=>`<div class="catalog-item"><div class="top"><b>${esc(x.name)}</b><span class="catalog-price">${euro(x.price)}/mes</span></div><small>${esc(x.sourceLabel||sourceLabel(x.source))}${x.promo?' · '+esc(x.promo):''}${x.after!=null?' · Después '+euro(x.after):''}${x.future?' · '+esc(x.future):''}</small><div class="tariff-meta">${(x.tags||[]).map(t=>`<span class="meta-pill">${esc(t)}</span>`).join('')}</div></div>`).join('')}</div></div>`;document.body.appendChild(d);$('closeModal').onclick=()=>d.remove();d.onclick=e=>{if(e.target===d)d.remove()}}
function showClient(){let b=base(),c=company();if(!b)return;let aft=afterTotal(),items=[...Array.from({length:b.linesIncluded||0},(_,i)=>`Línea ${i+1} incluida${b.shared?' · '+b.shared:''}`),...includedNames(),...addedLines.map(x=>'Línea adicional · '+x.name),...chosenExtras.map(x=>x.name)];let d=document.createElement('div');d.className='modal-bg';d.innerHTML=`<div class="client"><div class="client-card"><div class="client-head"><img src="${LOGOS.grupo}"><img src="${LOGOS[c.logo]}"></div><div class="eyebrow" style="margin-top:18px">Propuesta comercial</div><h1>Tu oferta ${esc(c.name)}</h1><div class="client-price">${euro(total())}<span style="font-size:14px">/mes</span></div>${aft!=null?`<div class="after">Después: ${euro(aft)}/mes</div>`:''}${b.future?`<div class="future">${esc(b.future)}</div>`:''}<div style="margin-top:16px"><b style="font-size:12px">${esc(b.name)}</b></div>${items.map(x=>`<div class="client-item">✓ ${esc(x)}</div>`).join('')}<div class="client-note">Precios con IVA incluido. Verifica siempre permanencias, promociones y condiciones vigentes antes de cerrar la contratación.</div><div class="client-actions"><button id="closeClient" class="btn">Cerrar</button><button id="printClient" class="btn primary">Imprimir / PDF</button></div></div></div>`;document.body.appendChild(d);$('closeClient').onclick=()=>d.remove();$('printClient').onclick=()=>window.print()}
function editOffer(index){let key=mode==='2p'?'twoP':'convergente',arr=company()[key],o=index==null?{id:'new'+Date.now(),name:'Nueva oferta',source:mode==='2p'?'2p':'general',sourceLabel:mode==='2p'?'2P':'Precio general',price:0,promo:'',after:null,future:'',linesIncluded:mode==='2p'?0:1,shared:'',tags:[]}:clone(arr[index]);let d=document.createElement('div');d.className='modal-bg';d.innerHTML=`<div class="modal edit-modal"><div class="modal-head"><h2>${index==null?'Nueva':'Editar'} oferta</h2><button class="btn icon-btn" id="closeEdit">×</button></div><div class="field"><label>Nombre</label><textarea id="eName">${esc(o.name)}</textarea></div><div class="two"><div class="field"><label>Precio €/mes</label><input id="ePrice" value="${o.price}"></div><div class="field"><label>Precio después €/mes</label><input id="eAfter" value="${o.after??''}"></div></div><div class="field"><label>Promoción</label><input id="ePromo" value="${esc(o.promo||'')}"></div><div class="two"><div class="field"><label>Segmento interno</label><input id="eSource" value="${esc(o.source||'')}"></div><div class="field"><label>Etiqueta visible</label><input id="eSourceLabel" value="${esc(o.sourceLabel||'')}"></div></div><div class="field"><label>Evolución / precio futuro</label><input id="eFuture" value="${esc(o.future||'')}"></div><div class="two"><div class="field"><label>Líneas incluidas</label><input id="eLines" type="number" min="0" value="${o.linesIncluded||0}"></div><div class="field"><label>GB / detalle compartido</label><input id="eShared" value="${esc(o.shared||'')}"></div></div><div class="field"><label>Etiquetas (coma)</label><input id="eTags" value="${esc((o.tags||[]).join(', '))}"></div><div style="display:flex;justify-content:flex-end;gap:8px"><button id="cancelEdit" class="btn">Cancelar</button><button id="saveEdit" class="btn primary">Guardar</button></div></div>`;document.body.appendChild(d);$('closeEdit').onclick=$('cancelEdit').onclick=()=>d.remove();$('saveEdit').onclick=()=>{o.name=$('eName').value.trim()||'Sin nombre';o.price=Number(String($('ePrice').value).replace(',','.'))||0;let av=$('eAfter').value.trim();o.after=av===''?null:Number(av.replace(',','.'));o.promo=$('ePromo').value.trim();o.source=$('eSource').value.trim()||(mode==='2p'?'2p':'general');o.sourceLabel=$('eSourceLabel').value.trim()||sourceLabel(o.source);o.future=$('eFuture').value.trim();o.linesIncluded=Math.max(0,Number($('eLines').value)||0);o.shared=$('eShared').value.trim();o.tags=$('eTags').value.split(',').map(x=>x.trim()).filter(Boolean);if(index==null)arr.push(o);else arr[index]=o;d.remove();save();renderCompany()}}
$('mainLogo').src=LOGOS.grupo;$('homeBtn').onclick=renderHome;$('catalogBtn').onclick=()=>{if(screen==='company')showCatalog()};$('adminBtn').onclick=()=>{admin=!admin;$('adminBtn').textContent=admin?'Cerrar edición':'Editar catálogo';if(screen==='company')renderCompany();else toast(admin?'Modo edición activado':'Modo edición desactivado')};renderHome();
</script></body></html>
